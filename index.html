  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231570EF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='5'/><path d='m8 12 3 3 5-6'/></svg>">
  <link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=9">
  <script>
    // Standard: hell. Dunkel nur, wenn der Nutzer es selbst eingeschaltet hat.
    document.documentElement.dataset.theme = 'light';
    try { if (localStorage.getItem('todo:theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch { /* ignorieren */ }
  </script>
  <script>
    // Immer die aktuelle Version zeigen: GitHub Pages erlaubt keine eigenen Cache-Regeln, und manche
    // Browser (z. B. In-App-Browser) halten alte Seiten lange vor. Daher: aktuelle Versionsnummer am
    // Cache vorbei abfragen und bei Abweichung die Seite einmal frisch laden.
    (() => {
      const current = document.querySelector('meta[name="app-version"]')?.content;
      const key = `fresh:${location.pathname}`;
      fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' })
        .then((r) => (r.ok ? r.json() : null))
        .then((data) => {
          const latest = data && String(data.version);
          if (!latest || latest === current) { try { sessionStorage.removeItem(key); } catch { /* egal */ } return; }
          try { if (sessionStorage.getItem(key) === latest) return; sessionStorage.setItem(key, latest); } catch { return; }
          // Seite im Browser-Cache durch die neue ersetzen, dann neu laden
          return fetch(location.href, { cache: 'reload' }).finally(() => location.reload());
        })
        .catch(() => { /* offline → einfach die vorhandene Version zeigen */ });
    })();
  </script>
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
      <symbol id="i-today" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M12 14h.01"/></symbol>
      <symbol id="i-week" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></symbol>
      <symbol id="i-all" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6Z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V4M4 4h13l-2 4 2 4H4"/></symbol>
      <symbol id="i-hash" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></symbol>
      <symbol id="i-notes" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <!-- Seitenleiste: Ansichten & Listen (mobil als Schublade) -->
    <aside id="sidebar" class="sidebar" aria-label="Ansichten und Listen">
      <div class="sidebar-head">
        <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
        <span class="brand-name">To-do</span>
        <button id="close-sidebar" class="icon-btn only-mobile" type="button" aria-label="Menü schließen"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <label class="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Aufgaben suchen" aria-label="Aufgaben suchen" enterkeyhint="search">
      </label>
      <nav id="smart-nav" class="nav" aria-label="Ansichten"></nav>
      <div class="nav-section">
        <span>Listen</span>
        <button id="add-list-btn" class="icon-btn small" type="button" aria-label="Liste hinzufügen" title="Liste hinzufügen"><svg class="icon"><use href="#i-plus"/></svg></button>
      </div>
      <form id="add-list-form" class="add-list" hidden>
        <input id="add-list-input" class="input" maxlength="40" placeholder="Name der Liste" aria-label="Name der neuen Liste">
      </form>
      <nav id="list-nav" class="nav" aria-label="Listen"></nav>
      <div class="sidebar-foot">
        <button id="theme-btn" class="nav-item" type="button"><svg class="icon"><use href="#i-moon"/></svg><span>Dunkles Design</span></button>
        <button id="export-btn" class="nav-item" type="button"><svg class="icon"><use href="#i-download"/></svg><span>Exportieren</span></button>
        <label class="nav-item" for="import-input"><svg class="icon"><use href="#i-upload"/></svg><span>Importieren</span></label>
        <input id="import-input" type="file" accept="application/json" hidden>
        <button id="reset-btn" class="nav-item" type="button"><svg class="icon"><use href="#i-refresh"/></svg><span>Demo-Daten laden</span></button>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <!-- Hauptbereich -->
    <main class="main">
      <header class="main-head">
        <button id="open-sidebar" class="icon-btn only-mobile" type="button" aria-label="Menü öffnen" aria-controls="sidebar" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button>
        <div class="title-wrap">
          <h1 id="view-title">Heute</h1>
          <p id="view-sub" class="view-sub"></p>
        </div>
      </header>

      <div id="progress" class="progress" hidden>
        <div class="progress-track"><span id="progress-bar"></span></div>
        <span id="progress-label"></span>
      </div>

      <!-- Schnelleingabe (Desktop inline, mobil als Sheet) -->
      <form id="quick-add" class="quick-add" autocomplete="off">
        <div class="qa-row">
          <span class="qa-plus" aria-hidden="true"><svg class="icon"><use href="#i-plus"/></svg></span>
          <input id="qa-input" class="qa-input" maxlength="300" placeholder="Aufgabe hinzufügen – z. B. „Hausarbeit abgeben morgen !hoch #Uni“" aria-label="Neue Aufgabe" aria-describedby="qa-help" enterkeyhint="done">
          <button class="qa-submit" type="submit" aria-label="Aufgabe hinzufügen"><svg class="icon"><use href="#i-arrow-up"/></svg></button>
        </div>
        <div class="qa-chips">
          <label class="chip" data-chip="date"><svg class="icon"><use href="#i-calendar"/></svg><span id="qa-date-label">Datum</span><input id="qa-date" type="date" aria-label="Fälligkeitsdatum"></label>
          <label class="chip" data-chip="priority"><svg class="icon"><use href="#i-flag"/></svg>
            <select id="qa-priority" aria-label="Priorität">
              <option value="keine">Keine Priorität</option><option value="niedrig">Niedrig</option><option value="mittel">Mittel</option><option value="hoch">Hoch</option>
            </select>
          </label>
          <label class="chip" data-chip="list"><svg class="icon"><use href="#i-hash"/></svg><select id="qa-list" aria-label="Liste"></select></label>
        </div>
        <p id="qa-help" class="qa-help">Erkennt <b>heute</b>, <b>morgen</b>, <b>Montag</b>, <b>24.12.</b>, <b>in 3 Tagen</b>, <b>!hoch</b> und <b>#Liste</b>.</p>
      </form>

      <section id="task-area" class="task-area" aria-live="polite"></section>
      <footer class="footer">Gebaut von <a href="https://github.com/Surhay276">Hüseyin Surhay Yilmaz</a> · <a href="https://github.com/Surhay276/todo-app">Quellcode auf GitHub</a></footer>
    </main>
  </div>

  <button id="fab" class="fab only-mobile" type="button" aria-label="Neue Aufgabe"><svg class="icon"><use href="#i-plus"/></svg></button>

  <!-- Aufgabendetails -->
  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <form id="detail-form" method="dialog">
      <div class="detail-head">
        <button id="detail-check" class="check" type="button" aria-label="Als erledigt markieren"><svg class="icon"><use href="#i-check"/></svg></button>
        <textarea id="detail-title" class="detail-title" rows="1" maxlength="200" aria-label="Titel"></textarea>
        <button class="icon-btn" value="close" aria-label="Schließen"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <p id="detail-error" class="field-error" role="alert"></p>

      <div class="field">
        <span class="field-label"><svg class="icon"><use href="#i-calendar"/></svg>Fällig</span>
        <div class="seg" id="detail-quickdates">
          <button type="button" data-days="0">Heute</button>
          <button type="button" data-days="1">Morgen</button>
          <button type="button" data-days="7">Nächste Woche</button>
          <button type="button" data-days="">Ohne</button>
        </div>
        <input id="detail-due" class="input" type="date" aria-label="Fälligkeitsdatum">
      </div>

      <div class="field">
        <span class="field-label"><svg class="icon"><use href="#i-flag"/></svg>Priorität</span>
        <div class="seg seg-prio" id="detail-priority" role="radiogroup" aria-label="Priorität">
          <button type="button" role="radio" data-p="keine">Keine</button>
          <button type="button" role="radio" data-p="niedrig">Niedrig</button>
          <button type="button" role="radio" data-p="mittel">Mittel</button>
          <button type="button" role="radio" data-p="hoch">Hoch</button>
        </div>
      </div>

      <label class="field">
        <span class="field-label"><svg class="icon"><use href="#i-hash"/></svg>Liste</span>
        <select id="detail-list" class="input"></select>
      </label>

      <label class="field">
        <span class="field-label"><svg class="icon"><use href="#i-notes"/></svg>Notizen</span>
        <textarea id="detail-notes" class="input" rows="4" maxlength="2000" placeholder="Details, Links, Teilschritte …"></textarea>
      </label>

      <div class="detail-foot">
        <button id="detail-delete" class="btn btn-danger" type="button"><svg class="icon"><use href="#i-trash"/></svg>Löschen</button>
        <button class="btn btn-primary" value="close">Fertig</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=9"></script>
</body>
</html>
