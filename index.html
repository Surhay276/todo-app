<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F9FAFB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C111D" media="(prefers-color-scheme: dark)">
  <title>Kanban-Board · Surhay Yilmaz</title>
  <meta name="description" content="Kanban-Board mit Drag & Drop, WIP-Limit, Filter, Dark Mode und JSON-Export – gebaut mit Vanilla JavaScript.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237F56D9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='3'/><path d='M9 3v18M15 3v18'/></svg>">
  <link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=3">
  <script>
    // Theme vor dem ersten Rendern setzen → kein Aufblitzen
    try { document.documentElement.dataset.theme = localStorage.getItem('kanban-board:theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { /* ignorieren */ }
  </script>
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    </defs>
  </svg>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
      <div>
        <h1>Kanban-Board</h1>
        <p class="brand-sub">Aufgaben planen, priorisieren, abschließen</p>
      </div>
    </div>

    <dl class="metrics" aria-live="polite">
      <div class="metric"><dt>Gesamt</dt><dd id="stat-total">0</dd></div>
      <div class="metric"><dt>Erledigt</dt><dd id="stat-done">0</dd></div>
      <div class="metric metric-warn"><dt>Überfällig</dt><dd id="stat-overdue">0</dd></div>
      <div class="metric metric-progress">
        <dt>Fortschritt <span id="progress-label">0 %</span></dt>
        <dd><span class="progress-track" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><span id="progress-bar" class="progress-bar"></span></span></dd>
      </div>
    </dl>
  </header>

  <nav class="toolbar" aria-label="Werkzeugleiste">
    <div class="search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Aufgaben durchsuchen" aria-label="Aufgaben durchsuchen" enterkeyhint="search">
    </div>
    <select id="priority-filter" class="select" aria-label="Nach Priorität filtern">
      <option value="alle">Alle Prioritäten</option>
      <option value="hoch">Hoch</option>
      <option value="mittel">Mittel</option>
      <option value="niedrig">Niedrig</option>
    </select>
    <div class="toolbar-end">
      <button id="theme-btn" class="btn btn-icon btn-secondary" type="button" aria-label="Dunkles Design einschalten">
        <svg class="icon"><use href="#i-moon"/></svg>
      </button>
      <details class="menu">
        <summary class="btn btn-icon btn-secondary" aria-label="Weitere Aktionen"><svg class="icon"><use href="#i-dots"/></svg></summary>
        <div class="menu-panel" role="menu">
          <button id="export-btn" type="button" role="menuitem"><svg class="icon"><use href="#i-download"/></svg>Board exportieren</button>
          <label for="import-input" role="menuitem"><svg class="icon"><use href="#i-upload"/></svg>Board importieren</label>
          <button id="reset-btn" type="button" role="menuitem"><svg class="icon"><use href="#i-refresh"/></svg>Demo-Daten laden</button>
        </div>
      </details>
      <input id="import-input" type="file" accept="application/json" hidden>
      <button id="new-task-btn" class="btn btn-primary btn-new" type="button">
        <svg class="icon"><use href="#i-plus"/></svg><span>Neue Aufgabe</span>
      </button>
    </div>
  </nav>

  <div id="column-tabs" class="tabs" role="tablist" aria-label="Spalte auswählen"></div>

  <main id="board" class="board"></main>

  <p class="hint">Karten per Drag &amp; Drop verschieben – oder fokussieren und mit <kbd>←</kbd> <kbd>→</kbd> zwischen Spalten bewegen. <kbd>Enter</kbd> bearbeitet.</p>

  <dialog id="task-dialog" aria-labelledby="dialog-title">
    <form id="task-form" novalidate>
      <div class="dialog-head">
        <h2 id="dialog-title">Neue Aufgabe</h2>
        <button type="button" class="btn btn-icon btn-ghost" id="close-btn" aria-label="Schließen"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <label class="field">
        <span class="field-label">Titel</span>
        <input name="title" class="input" maxlength="120" required autocomplete="off" aria-describedby="form-error">
      </label>
      <label class="field">
        <span class="field-label">Beschreibung <span class="optional">optional</span></span>
        <textarea name="description" class="input" rows="3" maxlength="1000"></textarea>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="field-label">Priorität</span>
          <select name="priority" class="input">
            <option value="niedrig">Niedrig</option>
            <option value="mittel" selected>Mittel</option>
            <option value="hoch">Hoch</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Fällig am <span class="optional">optional</span></span>
          <input name="due" type="date" class="input">
        </label>
      </div>
      <p id="form-error" class="field-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-btn" class="btn btn-secondary">Abbrechen</button>
        <button type="submit" class="btn btn-primary" id="submit-btn">Aufgabe anlegen</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="footer">
    Gebaut von <a href="https://github.com/Surhay276">Surhay Yilmaz</a> ·
    <a href="https://github.com/Surhay276/kanban-board">Quellcode auf GitHub</a>
  </footer>

  <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
